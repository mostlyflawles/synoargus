<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>SynoArgus</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/static/icon.svg" alt="" width="28" height="28"><span>SynoArgus</span></div>
  <div class="who" id="who" hidden><span class="priopill" id="prioPill" hidden></span><button class="modepill" id="modePill" hidden></button><span id="whoName"></span><button class="link" id="logoutBtn">Logga ut</button></div>
  <nav id="nav" hidden>
    <button data-tab="events" data-label="Händelser" class="active">Händelser</button>
    <button data-tab="settings" data-label="Inställningar">Inställningar</button>
    <button data-tab="status" data-label="Status">Status</button>
    <button data-tab="guide" data-label="Guide">Guide</button>
  </nav>
</header>
<div class="subnav" id="subnav" hidden>
  <button data-sub="cameras" data-label="Kameror">Kameror</button>
  <button data-sub="notifiers" data-label="Notifiering">Notifiering</button>
  <button data-sub="modes" data-label="Lägen">Lägen</button>
  <button data-sub="other" data-label="Övrigt">Övrigt</button>
</div>

<main id="main"><p class="muted center">…</p></main>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="viewer"><img id="viewerImg" alt=""><form method="dialog"><button id="viewerClose">Stäng</button></form></dialog>
<script src="/static/guide.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

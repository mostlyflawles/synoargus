services:
  synoargus:
    image: ghcr.io/mostlyflawles/synoargus:latest
    pull_policy: always            # "Build" in Container Manager pulls the newest version
    container_name: synoargus
    restart: unless-stopped
    init: true                     # stops cleanly (signals reach SynoArgus)
    stop_grace_period: 15s
    ports:
      - "8686:8686"
    volumes:
      - ./data:/data
    # Intel iGPU (e.g. DS918+). Remove these two lines if the container does not start.
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=Europe/Stockholm        # your time zone (can also be changed under Settings)
      - LOG_LEVEL=INFO
      # Locked out? Remove the # below and rebuild the project: all DSM accounts can then log in.
      # - SYNOARGUS_UNLOCK=1
    mem_limit: 1g

# ---------------------------------------------------------------------------
# Optional: own models (e.g. YOLO26). To enable, delete ONLY the first character (#)
